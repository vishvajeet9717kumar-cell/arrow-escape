name: Build Android APK and Play Store Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release Bundle (.aab)
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK (For direct phone install)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
